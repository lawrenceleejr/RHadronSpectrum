# Stage A quenched ensemble (Wilson plaquette action), self-generated with heatbath + over-relaxation.
tag: qA62
action: wilson_plaquette
beta: 6.2
shape: [64, 32, 32, 32]      # (Lt, Lz, Ly, Lx)
n_or: 4                      # compound sweep = 1 heatbath + 4 over-relaxation
n_therm: 700                  # compound sweeps discarded per stream
n_sep: 40                    # compound sweeps between saved configurations
target_configs: 512
seed: 32044
save_configs: true
gluelump:
  ape_alpha: 0.5
  ape_levels: [9, 18, 36, 63]            # enlarged basis 2026-11-27 (was 2 levels)
  shapes: [plaq, rect, chair, lplaq]
  tmax: 18
  hyp1_every: 4              # second static action (HYP1) on every 4th config
quark:                       # M4 valence sector at beta = 6.2 (NP clover, ALPHA c_SW)
  csw: 1.61375
  kappas: {l1: 0.13460, l2: 0.13510, l3: 0.13530, s: 0.13490}   # UKQCD hep-lat/9910022; s ~ m_etas (interpolated)
  light_roles: [l1, l2, l3]
  link_smear: {alpha: 0.5, n: 18}  # scaled ~ (a(6.0)/a(6.2))^2 x 10
  smear_levels: [[0.25, 55], [0.25, 165]]
  n_src: 8
  pair_sep: 16
  tmax: 18
  tol: 1.0e-9
  maxiter: 4000
  multigrid: [[4, 4, 4, 4], [2, 2, 2, 2]]
  no_multigrid: true         # benchmark at the first qA62 configs (lighter a m_q per kappa)
  static_actions: [HYP2, HYP1]
  seed: 62
  light_hadrons: false       # zero-momentum pi/rho/N only needed for M3 (passed at beta=6.0); saves ~3x4.8 GB GPU memory
