# Stage A quenched ensemble (Wilson plaquette action), self-generated with heatbath + over-relaxation.
tag: qA60
action: wilson_plaquette
beta: 6.0
shape: [48, 24, 24, 24]      # (Lt, Lz, Ly, Lx)
n_or: 4                      # compound sweep = 1 heatbath + 4 over-relaxation
n_therm: 500                  # compound sweeps discarded per stream
n_sep: 30                    # compound sweeps between saved configurations
target_configs: 600
seed: 2033
save_configs: true
gluelump:
  ape_alpha: 0.5
  ape_levels: [5, 10, 20, 35]            # enlarged basis 2026-11-27 (was 2 levels)
  shapes: [plaq, rect, chair, lplaq]
  tmax: 14
  hyp1_every: 4              # second static action (HYP1) on every 4th config
quark:                       # M3/M4 valence sector (NP clover, ALPHA c_SW at beta = 6.0)
  csw: 1.76923
  kappas: {l1: 0.13344, l2: 0.13417, l3: 0.13455, s: 0.13400}   # UKQCD hep-lat/9910022 kappas; s ~ m_etas
  light_roles: [l1, l2, l3]
  link_smear: {alpha: 0.5, n: 10}  # spatial APE links for Wuppertal smearing
  smear_levels: [[0.25, 30], [0.25, 90]]
  n_src: 16                  # 16 sources for configs measured after 2026-11-27 (8 before)
  tmax: 14
  tol: 1.0e-9
  maxiter: 3000
  multigrid: [[4, 4, 4, 4], [2, 2, 2, 2]]   # available; not used at these kappas
  no_multigrid: true         # mixed BiCGStab faster at beta=6.0 heavy kappas (docs/budget.md)
  static_actions: [HYP2, HYP1]
  seed: 61
  baryon_suite: true         # M3 nucleon cross-checks (N1 general path, N2, Delta) in nucleon jobs
  pair_sep: 12               # paired sources at the same spatial site (three-point densities)
